version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NPM_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    registries:
      - github-packages
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      clerk:
        patterns:
          - "@clerk/*"
      stripe:
        patterns:
          - stripe
      observability:
        patterns:
          - "@equinecode/hoof-observability"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
